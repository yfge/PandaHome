[project]
name = "self-host-server-api"
version = "0.1.0"
description = "Self Host Server API"
authors = [
    {name = "YunFei Ge", email = "geyunfei@gmail.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "miniupnpc>=2.2.5",
    "aliyun-python-sdk-core>=2.13.36",
    "aliyun-python-sdk-alidns>=2.6.46",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120 