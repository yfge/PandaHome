[project]
name = "self-host-server-api"
version = "0.1.0"
description = "Self Host Server API"
authors = [
    {name = "YunFei Ge", email = "geyunfei@gmail.com"},
]
dependencies = [
    "aiohttp>=3.9.0",
    "async-upnp-client>=0.37.0",
    "bcrypt>=4.0.1",
    "alembic>=1.14.0",
    "fastapi>=0.104.0",
    "miniupnpc>=2.2.5",
    "netifaces>=0.11.0",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=5.9.0",
    "sqlalchemy>=2.0.0",
    "aliyun-python-sdk-core>=2.13.36",
    "aliyun-python-sdk-alidns>=2.6.46",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.24.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
bootstrap-admin = "src.app.cli.bootstrap_admin:main"
api-tests = "pytest:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
